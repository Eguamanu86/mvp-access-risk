# Ambientes: local, test, prod, stage
APP_ENV: test
PROJECT_ID: madagascar-testing
LOG_LEVEL: debug

# GCP Secrets
SECRET_MAPPINGS: '
  mg-cr-access-risk-api:latest
  '

# Servicio de inferencia (alp-cr-access-risk-model)
MODEL_SERVICE_URL: 'https://alp-cr-access-risk-model-test-<hash>-uc.a.run.app'
MODEL_TIMEOUT_MS: '150'
MODEL_MANAGE_TOKEN: 'SET_VIA_SECRET_MANAGER'

# Circuit breaker
CIRCUIT_FAILURE_THRESHOLD: '3'
CIRCUIT_COOLDOWN_MS: '10000'

# Autenticacion servicio a servicio
SERVICE_TOKEN: 'SET_VIA_SECRET_MANAGER'
