# Plantilla de variables por ambiente para Cloud Run (ejemplo).
# Copia este archivo como `env.<ambiente>.yaml` y completa los valores reales.
# No incluye identificadores de proyecto ni secretos.
APP_ENV: stage
LOG_LEVEL: info

# Servicio de inferencia
MODEL_SERVICE_URL: 'http://access-risk-model:8080'
MODEL_TIMEOUT_MS: '150'

# Circuit breaker
CIRCUIT_FAILURE_THRESHOLD: '3'
CIRCUIT_COOLDOWN_MS: '10000'

# Secreto servicio a servicio (se resuelve al desplegar; dejar el valor real fuera del repo)
SERVICE_TOKEN: ''

# Token para los endpoints de gestion del modelo
MODEL_MANAGE_TOKEN: ''
