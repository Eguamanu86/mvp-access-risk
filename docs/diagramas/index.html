<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presentación y diagramas — Servicio Inteligente de Riesgo de Acceso</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 24px 28px 0;
      max-width: 1200px;
      margin: 0 auto;
    }
    .eyebrow {
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.78rem;
      font-weight: 600;
      margin: 0 0 8px;
    }
    h1 {
      font-size: 1.6rem;
      margin: 0 0 8px;
      line-height: 1.2;
    }
    .subtitle {
      color: var(--muted);
      margin: 0;
      font-size: 0.95rem;
    }
    .toolbar {
      max-width: 1200px;
      margin: 16px auto 0;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    button.tab {
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    button.tab:hover { border-color: var(--accent); }
    button.tab.active {
      color: #082f49;
      background: var(--accent);
      border-color: var(--accent);
    }
    a.cta {
      display: inline-block;
      text-decoration: none;
      color: var(--accent);
      border: 1px solid var(--accent);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 10px 16px;
      border-radius: 8px;
      transition: background 0.15s ease, color 0.15s ease;
      white-space: nowrap;
    }
    a.cta:hover { background: var(--accent); color: #082f49; }
    .stage {
      max-width: 1200px;
      margin: 16px auto 0;
      padding: 0 28px 28px;
    }
    .frame {
      width: 100%;
      height: 78vh;
      min-height: 560px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      overflow: hidden;
    }
    .frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">MIS-312 · MLOps</p>
    <h1>Servicio inteligente de riesgo de acceso</h1>
    <p class="subtitle">Presentación magistral y diagramas interactivos: el backend orquesta, la IA opina y el backend decide.</p>
  </header>

  <div class="toolbar">
    <div class="tabs" role="tablist">
      <button class="tab active" type="button" data-src="presentacion-magistral.html">Presentación magistral</button>
      <button class="tab" type="button" data-src="arquitectura-flujo-completo.html">Arquitectura y flujo</button>
      <button class="tab" type="button" data-src="como-funciona-el-ml.html">Cómo funciona el ML</button>
      <button class="tab" type="button" data-src="explicacion-simple.html">Explicación simple</button>
    </div>
    <a class="cta" id="fullscreen" href="presentacion-magistral.html" target="_blank" rel="noreferrer">Abrir en pantalla completa</a>
  </div>

  <div class="stage">
    <div class="frame">
      <iframe id="diagram" title="Presentación y diagramas" src="presentacion-magistral.html" allow="fullscreen" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    const iframe = document.getElementById('diagram');
    const fullscreen = document.getElementById('fullscreen');
    let activeSrc = 'presentacion-magistral.html';

    document.querySelectorAll('button.tab').forEach((button) => {
      button.addEventListener('click', () => {
        document.querySelectorAll('button.tab').forEach((b) => b.classList.remove('active'));
        button.classList.add('active');
        activeSrc = button.dataset.src;
        iframe.src = activeSrc;
        fullscreen.href = activeSrc;
        iframe.focus();
      });
    });

    // Reenvía la navegación por teclado al deck cuando está activo.
    document.addEventListener('keydown', (event) => {
      if (!activeSrc.includes('presentacion-magistral')) return;
      const map = {
        ArrowRight: 'next', PageDown: 'next', ' ': 'next',
        ArrowLeft: 'prev', PageUp: 'prev',
        Home: 'home', End: 'end'
      };
      const action = map[event.key];
      if (!action) return;
      event.preventDefault();
      if (iframe.contentWindow) {
        iframe.contentWindow.postMessage({ type: 'deck', action }, '*');
      }
    });
  </script>
</body>
</html>
